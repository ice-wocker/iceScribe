name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 内置 whisper 模型走 Git LFS 存储，不拉 LFS 会拿到 130 字节的指针文件，
          # 打出的 APK 里没有模型（体积也不对）
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        # 版本由仓库内的 Gradle Wrapper 决定；该 action 同时负责依赖缓存

      # ubuntu-latest 已预装 Android SDK；这里只补齐项目需要的 platform/build-tools/ndk/cmake。
      # 注意：不要用 android-actions/setup-android，它会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除该 package，会导致步骤失败。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK"
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            # whisper.cpp 原生编译需要 NDK 与 CMake 的固定版本
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" \
                       "ndk;27.2.12479018" "cmake;3.22.1" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 首次构建要从 GitHub 拉 whisper.cpp 源码；缓存住，后续构建快很多
      - name: Cache whisper.cpp source
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: whisper-cpp-${{ runner.os }}-v1.9.4-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}

      # secrets 不能直接用于步骤级 if 条件（会导致工作流校验失败），因此注入成 env 再判断
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ../release.keystore
            {
              echo "storeFile=../release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "已配置正式签名"
          else
            # Tag 发布的包会直接给用户下载，必须是正式签名，否则无法覆盖安装
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::发布 Release 前必须配置签名 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），否则会产出 debug 签名的包，用户无法覆盖安装。"
              exit 1
            fi
            echo "::warning::未配置签名 Secrets，本次 release 为 debug 签名（仅作 CI 产物，请勿用于发布）"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 仅在推送 v* 标签时自动发布 Release
      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "iceScribe-${GITHUB_REF_NAME#v}.apk"

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: iceScribe-*.apk
          generate_release_notes: true
          draft: false